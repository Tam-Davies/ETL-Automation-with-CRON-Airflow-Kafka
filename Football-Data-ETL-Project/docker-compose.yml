services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 'Mk3OEYBSD3t9SlvVqQ4Z8Q'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 9092))"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: timescale/timescaledb:latest-pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: football_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Kickboxing12#
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./configs/postgres_schemas.sql:/docker-entrypoint-initdb.d/init.sql

  spark-master:
    image: apache/spark:3.5.0
    environment:
      SPARK_MODE: master
    entrypoint: ["/opt/spark/sbin/start-master.sh"]
    ports: ["8080:8080", "7077:7077"]
    volumes:
      - ./src:/opt/src
      - ./data:/opt/data

  spark-worker:
    image: apache/spark:3.5.0
    depends_on: [spark-master]
    entrypoint: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    volumes:
      - ./src:/opt/src
      - ./data:/opt/data

  airflow:
    image: apache/airflow:2.9.1
    depends_on: [postgres]
    ports: ["8081:8080"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://spark:spark_pw@postgres/matches
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/src
    command: standalone

  grafana:
    image: grafana/grafana:latest
    depends_on: [postgres]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    environment:
      PYTHONPATH: /opt/src
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    env_file:
      - .env
    volumes:
      - ./src:/opt/src
    command: python -m football_etl.kafka_producer
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pg_data: