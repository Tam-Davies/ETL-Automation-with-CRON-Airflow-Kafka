version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: timescale/timescaledb:latest-pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: matches
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark_pw
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./configs/postgres_schemas.sql:/docker-entrypoint-initdb.d/init.sql

  spark-master:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE: master
    ports: ["8080:8080", "7077:7077"]
    volumes:
      - ./src:/opt/src
      - ./data:/opt/data

  spark-worker:
    image: bitnami/spark:3.5
    depends_on: [spark-master]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    volumes:
      - ./src:/opt/src
      - ./data:/opt/data

  airflow:
    image: apache/airflow:2.9.1
    depends_on: [postgres]
    ports: ["8081:8080"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://spark:spark_pw@postgres/matches
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/src
    command: standalone

  grafana:
    image: grafana/grafana:latest
    depends_on: [postgres]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on: [kafka]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MATCH_API_URL: https://api.example.com/v1/matches

volumes:
  pg_data:
