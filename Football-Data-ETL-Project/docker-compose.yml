services:

  # ============================================================
  # POSTGRESQL / TIMESCALEDB
  # ============================================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: football-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: football_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres_schemas.sql:/docker-entrypoint-initdb.d/001_postgres_schemas.sql:ro
      - ./configs/migrations/002_gold_match_summary.sql:/docker-entrypoint-initdb.d/002_gold_match_summary.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # KAFKA
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: football-kafka
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # FOOTBALL API PRODUCER
  # ============================================================
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy


  # ============================================================
  # SPARK MASTER
  # ============================================================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: football-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/src
    volumes:
      - ./src:/opt/src
      - ./data:/opt/data
    depends_on:
      - kafka
      - postgres


  # ============================================================
  # SPARK WORKER
  # ============================================================
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: football-spark-worker
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/src
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    volumes:
      - ./src:/opt/src
      - ./data:/opt/data


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: football-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${DB_PASSWORD}@postgres:5432/football_db
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
      PG_URL: ${PG_URL:-jdbc:postgresql://postgres:5432/football_db}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-${DB_PASSWORD}}
      PYTHONPATH: /opt/src
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/src


  # ============================================================
  # AIRFLOW WEBSERVER
  # ============================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: football-airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-scheduler:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${DB_PASSWORD}@postgres:5432/football_db
      AIRFLOW__WEBSERVER__WORKERS: 1
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/src


  # ============================================================
  # GRAFANA
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: football-grafana
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana


# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  postgres_data:
  grafana_data: